  if (existSnap.exists()) {
    if (existSnap.val().is_blocked) return renderBlocked();
    return boot();
  }

  const code = (document.getElementById('regRefCode').value || "").trim().toUpperCase();
  if (!code) { errBox.style.display='block'; errBox.textContent='❌ Referral Code দিন।'; return; }

  const adminCodeSnap = await DB.ref("settings/admin_referral_code").get();
  const adminCode = adminCodeSnap.exists() ? String(adminCodeSnap.val()).toUpperCase() : null;

  if (!adminCode) { errBox.style.display='block'; errBox.textContent='⚠️ Admin code setup নেই।'; return; }
  if (code !== adminCode) { errBox.style.display='block'; errBox.textContent='❌ ভুল Referral Code।'; return; }

  errBox.style.display = 'none';

  await DB.ref("users/" + MY_ID).set({
    id: MY_ID, telegram_id: tgUser.id,
    username: tgUser.username || null,
    first_name: tgUser.first_name || "User",
    last_name: tgUser.last_name || "",
    language: tgUser.language_code || "bn",
    balance_usd: 0, total_earned_usd: 0, total_withdrawn_usd: 0,
    referral_code: null, referred_by: "admin", referred_by_code: adminCode,
    referral_count: 0, level: 0, streak: 0, last_active_date: null,
    is_blocked: false, created_at: Date.now(), source: "telegram"
  });

  toast("✅ Registration successful!", "success");
  boot();
}

function renderBlocked(){
  document.getElementById('root').innerHTML = `
    <div class="reg-screen">
      <div class="reg-icon danger">⛔</div>
      <h1 class="reg-title">অ্যাকাউন্ট ব্লকড</h1>
      <a href="${BOT_LINK}" target="_blank" class="reg-cta">📞 যোগাযোগ</a>
    </div>`;
}

async function boot(){
  if (LISTENERS_ATTACHED) { render(); return; }
  LISTENERS_ATTACHED = true;

  DB.ref("users/" + MY_ID).on("value", snap => {
    if (!snap.exists()) { LISTENERS_ATTACHED = false; renderRegister(); return; }
    ME = snap.val();
    if (ME.is_blocked) { renderBlocked(); return; }
    render();
  });
  DB.ref("categories").on("value", snap => {
    const v = snap.val() || {};
    const adminCats = Object.entries(v).map(([k,val]) => ({ ...val, _id: k }));
    CATEGORIES = adminCats.length ? adminCats : DEFAULT_CATEGORIES;
    render();
  });
  DB.ref("tasks").on("value", snap => {
    const v = snap.val() || {};
    TASKS = Object.entries(v).map(([k,val]) => ({...val,_id:k}));
    render();
  });
  DB.ref("settings").on("value", snap => {
    SETTINGS = snap.val() || {};
    render();
  });
  DB.ref("completions").orderByChild("uid").equalTo(MY_ID).on("value", snap => {
    const v = snap.val() || {};
    COMPLETIONS = Object.entries(v).map(([k,val]) => ({...val,_id:k}));
    render();
  });
  DB.ref("withdrawals").orderByChild("uid").equalTo(MY_ID).on("value", snap => {
    const v = snap.val() || {};
    WITHDRAWALS = Object.entries(v).map(([k,val]) => ({...val,_id:k})).sort((a,b) => (b.created_at||0) - (a.created_at||0));
    render();
  });
}

function tasksInCategory(catId){
  return TASKS.filter(t => t.category === catId && t.is_active !== false);
}
function categoryTotalDollar(catId){
  const tasks = tasksInCategory(catId);
  if (!tasks.length) {
    const cat = CATEGORIES.find(c => (c.id || c._id) === catId);
    if (!cat) return 0;
    return (cat.reward || 0.05) * (cat.targetCount || 10);
  }
  return tasks.reduce((s,t) => s + Number(t.reward_usd || 0), 0);
}
function categoryCompletedCount(catId, day){
  const tasks = tasksInCategory(catId);
  const doneIds = new Set(COMPLETIONS.filter(c => c.day_key === day).map(c => c.task_id));
  return tasks.filter(t => doneIds.has(t._id)).length;
}
function isTaskDoneToday(taskId, day){
  return COMPLETIONS.some(c => c.task_id === taskId && c.day_key === day);
}

function renderCategoryCards(day){
  const list = document.getElementById('categoryList');

  if (!CATEGORIES.length) { list.innerHTML = "<div class='empty'>কোনো category নেই</div>"; return; }
  list.innerHTML = CATEGORIES.map(cat => {
    const catId = cat.id || cat._id;
    const total = tasksInCategory(catId).length || cat.targetCount || 0;
    const done = categoryCompletedCount(catId, day);
    const percent = total ? Math.round(done / total * 100) : 0;
    const totalDollar = categoryTotalDollar(catId);
    const borderClass = cat.borderClass || cat.type || "ad";
    return `
      <div class="cat-card ${borderClass}" onclick="openCategory('${catId}')">
        <div class="cat-icon">${cat.icon || "📋"}</div>
        <div class="cat-info">
          <b>${esc(cat.name || "Category")}</b>
          <div class="desc">${total ? total + " tasks" : "Unlimited"}</div>
          <div class="dollar">${money(totalDollar)} <span>${total ? "(total)" : "each"}</span></div>
          ${total ? `<div class="mini-progress"><i style="width:${percent}%"></i></div>
          <div class="status-line"><span>${done}/${total} done</span><span>${percent}%</span></div>` : ""}
        </div>
        <div class="cat-arrow">›</div>
      </div>`;
  }).join("");
}

    const isDone = isTaskDoneToday(t._id, day);

    return `

/* ═══════════════════════════════════════════════════════════
   🎬 TASK FLOW — Direct Link FIRST, then Video, then Counter
   ═══════════════════════════════════════════════════════════ */
async function startTask(taskId){
  const day = todayKey();
  const task = TASKS.find(t => t._id === taskId);
  if (!task) { toast("Task পাওয়া যায়নি", "error"); return; }

  const uSnap = await DB.ref("users/" + MY_ID).get();
  const u = uSnap.val();
  if (!u || u.is_blocked) { toast("Account blocked", "error"); return; }
  if (isTaskDoneToday(taskId, day)) { toast("✅ এই task আগেই করেছেন", "error"); return; }

  const adSnap = await DB.ref("ad_revenue/" + day).get();
  const ad = adSnap.val() || { revenue_usd: 0, reward_paid_usd: 0 };
  const cap = parseFloat(SETTINGS.MAX_REWARD_RATIO || 0.60);
  if (ad.revenue_usd > 0 && (ad.reward_paid_usd + task.reward_usd) > ad.revenue_usd * cap) {
    toast("আজকের reward budget শেষ", "error"); return;
  }

  CURRENT_TASK = task;
  openTaskModal(task);
}

  const btn = document.getElementById('directLinkBtn');

    </p>

    <div class="step-box">
      <div class="step-icon">📺</div>
      <div class="step-title">Step 2: Watch Video Ad</div>
      <div class="step-desc">ভিডিও অ্যাড দেখুন।<br>এরপর ${parseInt(task.verify_seconds || SETTINGS.TASK_COUNTER_SECONDS || 30)} সেকেন্ড counter চলবে।</div>
      <button class="video-btn" id="videoBtn" onclick="triggerVideo()">🎬 Watch Video Ad</button>
      <div id="videoStatus"></div>
    </div>`;

  document.getElementById('modalClose').onclick = () => {
    if (confirm("Task বন্ধ করলে reward পাবেন না।")) {
      document.getElementById('taskModal').classList.remove('show');
      CURRENT_TASK = null;
    }
  };
}

async function triggerVideo(){
  const btn = document.getElementById('videoBtn');
  const statusEl = document.getElementById('videoStatus');

  btn.disabled = true;
  btn.textContent = '⏳ Loading...';
  statusEl.innerHTML = '<div class="status-pill info">📺 Video Ad লোড হচ্ছে...</div>';

  // Call Monetag SDK
  try {
    const fn = window[MONETAG_SDK];
    if (typeof fn === "function") {
      const r = fn();
      if (r && typeof r.then === "function") {
        await r.catch(() => {});
      }
    } else {
      // SDK not loaded — wait and retry
      await new Promise(res => setTimeout(res, 1500));
      const retry = window[MONETAG_SDK];
      if (typeof retry === "function") {
        const r2 = retry();
        if (r2 && typeof r2.then === "function") await r2.catch(() => {});
      }
    }
  } catch(e) { console.warn(e); }

  statusEl.innerHTML = '<div class="status-pill success">✅ Video দেখানো হয়েছে!</div>';

  // After video → start counter
  setTimeout(() => startCounterStep(), 1200);
}

/* ═══════════════════════════════════════════════════════════
   STEP 3: 30s Counter
   ═══════════════════════════════════════════════════════════ */
function startCounterStep(){
  const body = document.getElementById('taskModalBody');
  const task = CURRENT_TASK;
  if (!task) return;

  const counter = parseInt(task.verify_seconds || SETTINGS.TASK_COUNTER_SECONDS || 30);

  body.innerHTML = `
    <button class="close-btn" id="modalClose" disabled>✕</button>
    <h3>🎬 ${esc(task.title || "Task")}</h3>
    <p class="small" style="color:#667085;margin:0 0 10px">
      Reward: <b style="color:#16a34a">${money(task.reward_usd)}</b>
    </p>

    <div class="step-box">
      <div class="step-title">Step 3: অপেক্ষা করুন</div>
      <div class="step-desc">${counter} সেকেন্ড অপেক্ষা করুন</div>

      <div class="counter-wrap">
        <div class="counter-circle" id="counterCircle" style="--pct:0%">
          <div style="position:relative;text-align:center">
            <div class="counter-num" id="counterNum">${counter}</div>
            <div class="counter-label">SECONDS</div>
          </div>
        </div>
        <div class="counter-hint" id="counterHint">⏳ অপেক্ষা করুন...</div>
      </div>

      <button class="verify-btn" id="claimBtn" disabled>⏳ Wait (<span id="waitNum">${counter}</span>s)</button>
    </div>`;

  let remaining = counter;
  const circle = document.getElementById('counterCircle');
  const num = document.getElementById('counterNum');
  const waitNum = document.getElementById('waitNum');
  const hint = document.getElementById('counterHint');
  const claimBtn = document.getElementById('claimBtn');
  const closeBtn = document.getElementById('modalClose');

  const interval = setInterval(() => {
    remaining--;
    const pct = ((counter - remaining) / counter) * 100;
    circle.style.setProperty('--pct', pct + '%');
    num.textContent = Math.max(0, remaining);
    waitNum.textContent = Math.max(0, remaining);

    if (remaining <= 0) {
      clearInterval(interval);
      hint.textContent = '🎉 টাইমার শেষ! এখন Claim করুন';
      hint.classList.add('done');
      claimBtn.disabled = false;
      claimBtn.classList.add('ready');
      claimBtn.innerHTML = '✅ Claim ' + money(task.reward_usd);
      closeBtn.disabled = false;
      claimBtn.onclick = () => finalizeTask(task);
    }
  }, 1000);

  closeBtn.onclick = () => {
    if (confirm("Task বন্ধ করলে reward পাবেন না।")) {
      clearInterval(interval);
      document.getElementById('taskModal').classList.remove('show');
      CURRENT_TASK = null;
    }
  };
}

async function finalizeTask(task){
  const day = todayKey();
  await DB.ref("users/" + MY_ID).transaction(cur => {
    if (!cur) return cur;
    cur.balance_usd = Number(cur.balance_usd || 0) + Number(task.reward_usd);
    cur.total_earned_usd = Number(cur.total_earned_usd || 0) + Number(task.reward_usd);
    if (cur.last_active_date !== day) {
      const y = new Date(); y.setDate(y.getDate()-1);
      const yKey = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
      if (cur.last_active_date === yKey) cur.streak = Number(cur.streak||0)+1;
      else cur.streak = 1;
      cur.last_active_date = day;
    }
    return cur;
  });
  await DB.ref("completions").push({
    uid: MY_ID, task_id: task._id, category: task.category || "",
    reward_usd: task.reward_usd, status: "verified",
    direct_link_opened: true, video_watched: true,
    day_key: day, created_at: Date.now()
  });
  await DB.ref("ad_revenue/" + day).transaction(cur => {
    if (!cur) cur = { revenue_usd: 0, reward_paid_usd: 0 };
    cur.reward_paid_usd = Number(cur.reward_paid_usd || 0) + Number(task.reward_usd);
    return cur;
  });
  DB.ref("ledger").push({
    uid: MY_ID, kind: "task_reward", amount_usd: task.reward_usd,
    ref_id: "task:" + task._id, created_at: Date.now()
  });
  document.getElementById('taskModal').classList.remove('show');
  CURRENT_TASK = null;
  toast("✅ +" + money(task.reward_usd) + " earned!", "success");
}

/* NAV */
function nav(id, el){
  CURRENT_CATEGORY = null;
  CURRENT_SECTION = id;
  document.querySelectorAll('.section').forEach(x => x.classList.remove('show'));
  const sec = document.getElementById(id);
  if (sec) sec.classList.add('show');
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function previewWdCut(){
  const amt = parseFloat(document.getElementById('wdAmt').value);
  const preview = document.getElementById('wdPreview');
  const refCount = Number(ME.referral_count || 0);
  const range = getWithdrawRange(refCount);
  if (!range || isNaN(amt) || amt <= 0) { preview.style.display = 'none'; return; }
  const cutAmount = amt * range.cut / 100;
  const finalAmount = amt - cutAmount;
  const rate = parseFloat(SETTINGS.USD_TO_BDT || 123);
  preview.style.display = 'block';
  preview.innerHTML = `
    <div style="display:flex;justify-content:space-between"><span>Requested:</span><b>$${amt.toFixed(2)}</b></div>
    <div style="display:flex;justify-content:space-between;color:#b45309"><span>Cut (${range.cut}%):</span><b>-$${cutAmount.toFixed(2)}</b></div>
    <div style="display:flex;justify-content:space-between;color:#15803d"><span>You receive:</span><b>$${finalAmount.toFixed(2)}</b></div>`;
}

async function requestWd(){
  const msg = document.getElementById('wdMsg');
  const method = document.getElementById('wdMethod').value;
  const acc = document.getElementById('wdAcc').value.trim();
  const amt = parseFloat(document.getElementById('wdAmt').value);
  const rate = parseFloat(SETTINGS.USD_TO_BDT || 123);
  const refCount = Number(ME.referral_count || 0);
  const range = getWithdrawRange(refCount);

  if (!range) { msg.textContent = "❌ Level unlock নেই"; msg.style.color = "#b91c1c"; return; }
  if (!acc || acc.length < 6) { msg.textContent = "❌ Valid account"; msg.style.color = "#b91c1c"; return; }
  if (isNaN(amt) || amt < range.min) { msg.textContent = "❌ Min $" + range.min.toFixed(2); msg.style.color = "#b91c1c"; return; }
  if (amt > range.max) { msg.textContent = "❌ Max $" + range.max.toFixed(2); msg.style.color = "#b91c1c"; return; }
  if (amt > Number(ME.balance_usd||0)) { msg.textContent = "❌ Balance নেই"; msg.style.color = "#b91c1c"; return; }

  const cutAmount = amt * range.cut / 100;
  const finalUsd = amt - cutAmount;
  const finalBdt = finalUsd * rate;

  const userRef = DB.ref("users/" + MY_ID);
  let ok = false;
  await userRef.transaction(cur => {
    if (!cur) return cur;
    if (Number(cur.balance_usd) < amt) return;
    cur.balance_usd = Number(cur.balance_usd) - amt;
    ok = true;
    return cur;
  });
  if (!ok) { msg.textContent = "❌ Failed"; return; }

  const wdRef = DB.ref("withdrawals").push();
  await wdRef.set({
    uid: MY_ID, user_name: ME.first_name || "", username: ME.username || null,
    amount_usd: amt, cut_pct: range.cut, cut_amount: cutAmount,
    final_usd: finalUsd, amount_bdt: Math.round(finalBdt * 100) / 100,
    method, account_number: acc, status: "pending", admin_note: "",
    level_at_request: range.level,
    created_at: Date.now(), processed_at: null
  });
  msg.textContent = "✅ Submitted!";
  msg.style.color = "#15803d";
  toast("✅ Withdrawal requested", "success");
}

function copyRef(){
  const el = document.getElementById('refLink');
  if (!el) return;
  const text = el.textContent.trim();
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast("📋 Copied!", "success"));
}

(async () => { await startApp(); })();
</script>
