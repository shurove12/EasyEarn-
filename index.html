  return new Promise(async (resolve) => {
    try {
      const fn = window[MONETAG_SDK];
      if (typeof fn !== "function") {
        // SDK not loaded yet — wait & retry

        return;
      }
      fn().then(() => resolve(true)).catch(() => resolve(false));
    } catch(e) {
      console.warn("Video error:", e);
      resolve(false);
    }
  });
}

    } catch(e) {

    }
  });
}

   UTILS

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function toast(msg, type=""){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.className = 'toast ' + type, 2600);
}
function esc(s){ return String(s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return "$" + Number(n||0).toFixed(2); }

function generateUserCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 8; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  return code;
}
async function generateUniqueCode(){
  for (let attempt = 0; attempt < 10; attempt++) {
    const code = generateUserCode();
    const snap = await DB.ref("referral_codes/" + code).get();
    if (!snap.exists()) return code;
  }
  return "U" + Date.now().toString(36).toUpperCase().slice(-7);
}

async function autoFixMyCode(){
  if (!ME) return;
  try {
    if (!ME.referral_code) {
      const newCode = await generateUniqueCode();
      await DB.ref("users/" + MY_ID + "/referral_code").set(newCode);
      await DB.ref("referral_codes/" + newCode).set(MY_ID);
      return newCode;
    }
    const check = await DB.ref("referral_codes/" + ME.referral_code).get();
    if (!check.exists()) {
      await DB.ref("referral_codes/" + ME.referral_code).set(MY_ID);
    }
    return ME.referral_code;
  } catch(e) { console.error(e); }
}

function getCurrentLevel(n){ let lv=0; for(const L of LEVELS){ if(n>=L.required) lv=L.lv; else break; } return lv; }
function getNextLevel(n){ for(const L of LEVELS){ if(n<L.required) return L; } return null; }
function getLevelData(lv){ return LEVELS.find(L=>L.lv===lv)||null; }
function canWithdraw(n){ return n >= LEVELS[0].required; }
function getWithdrawRange(n){
  const lv = getCurrentLevel(n);
  if (lv < 1) return null;
  const L = getLevelData(lv);
  return { min: L.minWd, max: L.maxWd, cut: L.cut, level: lv };
}

/* ═══ COOLDOWN ═══ */
async function checkCooldown(){
  if (!ME) return false;
  const now = Date.now();
  const cooldownUntil = Number(ME.cooldown_until || 0);
  if (cooldownUntil > now) {
    showCooldown(cooldownUntil - now);
    return true;
  }
  return false;
}

function showCooldown(ms){
  const screen = document.getElementById('cooldownScreen');
  const timer = document.getElementById('cooldownTimer');
  const mins = document.getElementById('cooldownMinutes');
  const secs = document.getElementById('cooldownSecs');
  screen.classList.add('show');
  if (COOLDOWN_INTERVAL) clearInterval(COOLDOWN_INTERVAL);
  COOLDOWN_INTERVAL = setInterval(() => {
    ms -= 1000;
    if (ms <= 0) {
      clearInterval(COOLDOWN_INTERVAL);
      screen.classList.remove('show');
      toast("✅ Cooldown শেষ! এখন task করতে পারবেন", "success");
      DB.ref("users/" + MY_ID + "/cooldown_until").set(0);
      DB.ref("users/" + MY_ID + "/recent_task_count").set(0);
      return;
    }
    const totalSecs = Math.floor(ms / 1000);
    const m = Math.floor(totalSecs / 60);
    const s = totalSecs % 60;
    mins.textContent = m + ":" + String(s).padStart(2, "0");
    secs.textContent = totalSecs;
    const pct = ((COOLDOWN_MINUTES * 60 - totalSecs) / (COOLDOWN_MINUTES * 60)) * 100;
    timer.style.setProperty('--pct', pct + '%');
  }, 1000);
}

async function attemptRegister(){
  const errBox = document.getElementById('regError');
  errBox.style.display = 'none';
  const tgUser = tg.initDataUnsafe.user;
  if (!tgUser || !tgUser.id) { errBox.style.display='block'; errBox.textContent='❌ Telegram ID নেই।'; return; }
  MY_ID = "tg_" + tgUser.id;

  const existSnap = await DB.ref("users/" + MY_ID).get();
  if (existSnap.exists()) {
    if (existSnap.val().is_blocked) return renderBlocked();
    return boot();
  }

  const code = (document.getElementById('regRefCode').value || "").trim().toUpperCase();
  if (!code) { errBox.style.display='block'; errBox.textContent='❌ Referral Code দিন।'; return; }

  let referrerId = null;
  let referrerType = "unknown";

  const refSnap = await DB.ref("referral_codes/" + code).get();
  if (refSnap.exists()) {
    referrerId = refSnap.val();
    referrerType = referrerId === "admin" ? "admin" : "user";
  } else {
    const adminCodeSnap = await DB.ref("settings/admin_referral_code").get();
    const adminCode = adminCodeSnap.exists() ? String(adminCodeSnap.val()).toUpperCase() : null;
    if (adminCode && code === adminCode) {
      referrerId = "admin";
      referrerType = "admin";
    }
  }

  if (!referrerId) {
    errBox.style.display='block';
    errBox.textContent='❌ এই Referral Code সঠিক নয়। Admin বা member-এর কাছ থেকে নিন।';
    return;
  }

  if (referrerId === MY_ID) {
    errBox.style.display='block';
    errBox.textContent='❌ নিজের code দিয়ে register করা যাবে না।';
    return;
  }

  errBox.style.display = 'none';

  const myCode = await generateUniqueCode();

  await DB.ref("users/" + MY_ID).set({
    id: MY_ID, telegram_id: tgUser.id,
    username: tgUser.username || null,
    first_name: tgUser.first_name || "User",
    last_name: tgUser.last_name || "",
    language: tgUser.language_code || "bn",
    balance_usd: 0, total_earned_usd: 0, total_withdrawn_usd: 0,
    referral_code: myCode,
    referred_by: referrerId,
    referred_by_code: code,
    referral_count: 0, level: 0, streak: 0, last_active_date: null,
    is_blocked: false, created_at: Date.now(), source: "telegram",
    cooldown_until: 0, recent_task_count: 0
  });

  await DB.ref("referral_codes/" + myCode).set(MY_ID);

  if (referrerType === "user" && referrerId !== "admin") {
    await DB.ref("users/" + referrerId).transaction(cur => {
      if (!cur) return cur;
      cur.referral_count = Number(cur.referral_count || 0) + 1;
      const newRef = cur.referral_count;
      const prevLevel = getCurrentLevel(newRef - 1);
      const newLevel = getCurrentLevel(newRef);
      if (newLevel > prevLevel) {
        const L = getLevelData(newLevel);
        cur.level = newLevel;
        cur.balance_usd = Number(cur.balance_usd || 0) + L.bonus;
        cur.total_earned_usd = Number(cur.total_earned_usd || 0) + L.bonus;
        DB.ref("ledger").push({
          uid: referrerId, kind: "level_bonus", amount_usd: L.bonus,
          ref_id: "level:" + newLevel, meta: L.name, created_at: Date.now()
        });
      }
      return cur;
    });

    const baseBonus = 0.10;
    await DB.ref("users/" + referrerId).transaction(cur => {
      if (!cur) return cur;
      cur.balance_usd = Number(cur.balance_usd || 0) + baseBonus;
      cur.total_earned_usd = Number(cur.total_earned_usd || 0) + baseBonus;
      return cur;
    });
    DB.ref("ledger").push({
      uid: referrerId, kind: "referral_bonus", amount_usd: baseBonus,
      ref_id: "ref:" + MY_ID, meta: "New referral", created_at: Date.now()
    });
  }

  toast("✅ Registration successful!", "success");
  boot();
}

    if (!snap.exists()) { LISTENERS_ATTACHED = false; renderRegister(); return; }
    ME = snap.val();
    if (ME.is_blocked) { renderBlocked(); return; }
    await autoFixMyCode();
    await checkCooldown();
    render();

  DB.ref("categories").on("value", snap => {

    const v = snap.val() || {};

function tasksInCategory(catId){
  return TASKS.filter(t => t.category === catId && t.is_active !== false);

function categoryTotalDollar(catId){
  const tasks = tasksInCategory(catId);
  if (!tasks.length) {
    const cat = CATEGORIES.find(c => (c.id || c._id) === catId);
    if (!cat) return 0;
    return (cat.reward || 0.05) * (cat.targetCount || 10);
  }
  return tasks.reduce((s,t) => s + Number(t.reward_usd || 0), 0);
}
function categoryCompletedCount(catId, day){
  const tasks = tasksInCategory(catId);
  const doneIds = new Set(COMPLETIONS.filter(c => c.day_key === day).map(c => c.task_id));
  return tasks.filter(t => doneIds.has(t._id)).length;
}

      <div class="row"><span>Username</span><b>${ME.username ? "@"+esc(ME.username) : "—"}</b></div>
      <div class="row"><span>Your Code</span><b style="font-family:monospace;color:#2563eb">${esc(myCode)}</b></div>
      <div class="row"><span>Referred By Code</span><b style="font-family:monospace">${esc(ME.referred_by_code || "—")}</b></div>
      <div class="row"><span>Level</span><b>${curLevel > 0 ? 'Lv ' + curLevel : 'Locked'}</b></div>
      <div class="row"><span>Referrals</span><b>${refCount}</b></div>
      <div class="row"><span>Total Earned</span><b>${money(ME.total_earned_usd)}</b></div>
      <div class="row"><span>Tasks Completed</span><b>${COMPLETIONS.length}</b></div>
    </div>
  </div>

  <nav>
    <button class="${CURRENT_SECTION==='home'?'active':''}" onclick="nav('home',this)">🏠<br>Home</button>
    <button class="${CURRENT_SECTION==='levels'?'active':''}" onclick="nav('levels',this)">🏆<br>Levels</button>
    <button class="${CURRENT_SECTION==='invite'?'active':''}" onclick="nav('invite',this)">👥<br>Invite</button>
    <button class="${CURRENT_SECTION==='withdraw'?'active':''}" onclick="nav('withdraw',this)">💸<br>Withdraw</button>
    <button class="${CURRENT_SECTION==='profile'?'active':''}" onclick="nav('profile',this)">👤<br>Profile</button>
  </nav>`;

  renderCategoryCards(day);
}

function renderCategoryCards(day){
  const list = document.getElementById('categoryList');
  if (!list) return;
  if (!CATEGORIES.length) { list.innerHTML = "<div class='empty'>কোনো category নেই</div>"; return; }
  list.innerHTML = CATEGORIES.map(cat => {
    const catId = cat.id || cat._id;
    const total = tasksInCategory(catId).length || cat.targetCount || 0;
    const done = categoryCompletedCount(catId, day);
    const percent = total ? Math.round(done / total * 100) : 0;
    const totalDollar = categoryTotalDollar(catId);
    const borderClass = cat.borderClass || cat.type || "ad";
    return `
      <div class="cat-card ${borderClass}" onclick="openCategory('${catId}')">
        <div class="cat-icon">${cat.icon || "📋"}</div>
        <div class="cat-info">
          <b>${esc(cat.name || "Category")}</b>
          <div class="desc">${total ? total + " tasks" : "Unlimited"}</div>
          <div class="dollar">${money(totalDollar)} <span>${total ? "(total)" : "each"}</span></div>
          ${total ? `<div class="mini-progress"><i style="width:${percent}%"></i></div>
          <div class="status-line"><span>${done}/${total} done</span><span>${percent}%</span></div>` : ""}
        </div>
        <div class="cat-arrow">›</div>
      </div>`;
  }).join("");
}

function renderCategoryDetail(cat, day){
  const catId = cat.id || cat._id;
  const tasks = tasksInCategory(catId);
  const total = tasks.length;
  const done = categoryCompletedCount(catId, day);
  const percent = total ? Math.round(done / total * 100) : 0;
  const totalDollar = categoryTotalDollar(catId);
  const earnedToday = tasks.filter(t => isTaskDoneToday(t._id, day)).reduce((s,t) => s + Number(t.reward_usd || 0), 0);

  document.getElementById('root').innerHTML = `
  <div class="cat-detail-header">
    <div class="top-bar">
      <button class="back-btn" onclick="closeCategory()">←</button>
      <h1>${cat.icon || "📋"} ${esc(cat.name || "Category")}</h1>
    </div>
    <div class="big-dollar">${money(totalDollar)}</div>
    <div class="sub">${total ? `${done}/${total} · ${percent}%` : "Unlimited"}</div>
    ${total ? `<div class="cat-progress"><i style="width:${percent}%"></i></div>` : ""}
    <div class="sub" style="margin-top:8px">💰 Earned today: <b>${money(earnedToday)}</b></div>
  </div>
  <div id="taskListContainer"></div>
  <nav>
    <button onclick="closeCategory(); nav('home', document.querySelectorAll('nav button')[0])">🏠<br>Home</button>
    <button onclick="closeCategory(); nav('levels', document.querySelectorAll('nav button')[1])">🏆<br>Levels</button>
    <button onclick="closeCategory(); nav('invite', document.querySelectorAll('nav button')[2])">👥<br>Invite</button>
    <button onclick="closeCategory(); nav('withdraw', document.querySelectorAll('nav button')[3])">💸<br>Withdraw</button>
    <button onclick="closeCategory(); nav('profile', document.querySelectorAll('nav button')[4])">👤<br>Profile</button>
  </nav>`;
  renderTaskList(tasks, day);
}

function renderTaskList(tasks, day){
  const container = document.getElementById('taskListContainer');
  if (!container) return;
  if (!tasks.length) { container.innerHTML = "<div class='empty'>কোনো task নেই।</div>"; return; }
  container.innerHTML = tasks.map((t, i) => {
    const isDone = isTaskDoneToday(t._id, day);
    const label = t.title || ("Task " + (i+1));
    return `
      <div class="t-row ${isDone ? 'done' : ''}">
        <div class="t-num">${i+1}</div>
        <div class="t-info">
          <b>${esc(label)}</b>
          <div class="reward">${money(t.reward_usd)}</div>
        </div>
        ${isDone ? `<span class="done-badge">✅ Done</span>` : `<button class="start-btn" onclick="startTask('${t._id}')">▶️ Start</button>`}
      </div>`;
  }).join("");
}

function openCategory(catId){
  const cat = CATEGORIES.find(c => (c.id || c._id) === catId);
  if (!cat) return;
  CURRENT_CATEGORY = cat;
  CURRENT_SECTION = "category";
  window.scrollTo({ top: 0 });
  render();
}
function closeCategory(){
  CURRENT_CATEGORY = null;
  CURRENT_SECTION = "home";
  render();
}

/* ═══ TASK FLOW ═══ */
async function startTask(taskId){
  const day = todayKey();
  const inCooldown = await checkCooldown();
  if (inCooldown) { toast("⛔ Cooldown চলছে, অপেক্ষা করুন", "error"); return; }

  const task = TASKS.find(t => t._id === taskId);
  if (!task) { toast("Task পাওয়া যায়নি", "error"); return; }

  const uSnap = await DB.ref("users/" + MY_ID).get();
  const u = uSnap.val();
  if (!u || u.is_blocked) { toast("Account blocked", "error"); return; }
  if (isTaskDoneToday(taskId, day)) { toast("✅ এই task আগেই করেছেন", "error"); return; }

  const adSnap = await DB.ref("ad_revenue/" + day).get();
  const ad = adSnap.val() || { revenue_usd: 0, reward_paid_usd: 0 };
  const cap = parseFloat(SETTINGS.MAX_REWARD_RATIO || 0.60);
  if (ad.revenue_usd > 0 && (ad.reward_paid_usd + task.reward_usd) > ad.revenue_usd * cap) {
    toast("আজকের reward budget শেষ", "error"); return;
  }

  CURRENT_TASK = task;
  openTaskModal(task);
}

function openTaskModal(task){
  const modal = document.getElementById('taskModal');
  const body = document.getElementById('taskModalBody');
  const counter = parseInt(task.verify_seconds || SETTINGS.TASK_COUNTER_SECONDS || 30);

  // ═══ AUTO-ROTATE: পরের link ═══
  const directLink = getNextDirectLink();
  try {
    if (tg && tg.openLink) tg.openLink(directLink);
    else window.open(directLink, "_blank", "noopener");
  } catch(e) { console.warn(e); }

  body.innerHTML = `
    <button class="close-btn" id="modalClose" disabled>✕</button>
    <h3>🎬 ${esc(task.title || "Task")}</h3>
    <p class="small" style="color:#667085;margin:0 0 10px">
      Reward: <b style="color:#16a34a">${money(task.reward_usd)}</b>
    </p>

    <div style="background:#dbeafe;padding:10px;border-radius:10px;font-size:12px;color:#1e40af;text-align:center;margin-bottom:12px">
      🔗 Sponsor link #${currentLinkIndex} — new tab-এ খোলা হয়েছে
    </div>

    <div class="counter-wrap">
      <div class="counter-circle" id="counterCircle" style="--pct:0%">
        <div style="position:relative;text-align:center">
          <div class="counter-num" id="counterNum">${counter}</div>
          <div class="counter-label">SECONDS</div>
        </div>
      </div>
      <div class="counter-hint" id="counterHint">⏳ অপেক্ষা করুন...</div>
    </div>

    <button class="verify-btn" id="claimBtn" disabled>⏳ Wait (<span id="waitNum">${counter}</span>s)</button>`;

  modal.classList.add('show');

  let remaining = counter;
  const circle = document.getElementById('counterCircle');
  const num = document.getElementById('counterNum');
  const waitNum = document.getElementById('waitNum');
  const hint = document.getElementById('counterHint');
  const claimBtn = document.getElementById('claimBtn');
  const closeBtn = document.getElementById('modalClose');

  const interval = setInterval(() => {
    remaining--;
    const pct = ((counter - remaining) / counter) * 100;
    circle.style.setProperty('--pct', pct + '%');
    num.textContent = Math.max(0, remaining);
    waitNum.textContent = Math.max(0, remaining);

    if (remaining <= 0) {
      clearInterval(interval);
      hint.textContent = '🎉 টাইমার শেষ! Claim করুন';
      hint.classList.add('done');
      claimBtn.disabled = false;
      claimBtn.classList.add('ready');
      claimBtn.innerHTML = '✅ Claim ' + money(task.reward_usd);
      closeBtn.disabled = false;
      claimBtn.onclick = () => showVideoStep(task);
    }
  }, 1000);

  closeBtn.onclick = () => {
    if (confirm("Task বন্ধ করলে reward পাবেন না।")) {
      clearInterval(interval);
      modal.classList.remove('show');
      CURRENT_TASK = null;
    }
  };
}

async function showVideoStep(task){
  const body = document.getElementById('taskModalBody');

  body.innerHTML = `
    <button class="close-btn" disabled>✕</button>
    <h3>🎬 ${esc(task.title || "Task")}</h3>
    <div style="text-align:center;padding:30px 0">
      <div class="spinner"></div>
      <div class="status-pill info">🎬 Video Ad লোড হচ্ছে...</div>
    </div>`;

  // ═══ Rewarded Video (11832634) ═══
  const videoSuccess = await showRewardedVideo();

  body.innerHTML = `
    <button class="close-btn" disabled>✕</button>
    <h3>🎬 ${esc(task.title || "Task")}</h3>
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:64px;margin-bottom:10px">${videoSuccess ? '✅' : '⚠️'}</div>
      <div class="status-pill ${videoSuccess ? 'success' : 'info'}" style="font-size:15px">
        ${videoSuccess ? 'Video দেখা হয়েছে!' : 'Video skip হয়েছে'}
      </div>
      <p style="color:#667085;font-size:13px;margin-top:14px">Reward claim হচ্ছে...</p>
      <div class="spinner" style="margin-top:14px"></div>
    </div>`;

  setTimeout(() => finalizeTask(task), 1200);
}

async function finalizeTask(task){
  const day = todayKey();
  await DB.ref("users/" + MY_ID).transaction(cur => {
    if (!cur) return cur;
    cur.balance_usd = Number(cur.balance_usd || 0) + Number(task.reward_usd);
    cur.total_earned_usd = Number(cur.total_earned_usd || 0) + Number(task.reward_usd);
    if (cur.last_active_date !== day) {
      const y = new Date(); y.setDate(y.getDate()-1);
      const yKey = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
      if (cur.last_active_date === yKey) cur.streak = Number(cur.streak||0)+1;
      else cur.streak = 1;
      cur.last_active_date = day;
    }
    return cur;
  });
  await DB.ref("completions").push({
    uid: MY_ID, task_id: task._id, category: task.category || "",
    reward_usd: task.reward_usd, status: "verified",
    direct_link_opened: true, video_watched: true,
    link_index: currentLinkIndex,
    day_key: day, created_at: Date.now()
  });
  await DB.ref("ad_revenue/" + day).transaction(cur => {
    if (!cur) cur = { revenue_usd: 0, reward_paid_usd: 0 };
    cur.reward_paid_usd = Number(cur.reward_paid_usd || 0) + Number(task.reward_usd);
    return cur;
  });
  DB.ref("ledger").push({
    uid: MY_ID, kind: "task_reward", amount_usd: task.reward_usd,
    ref_id: "task:" + task._id, created_at: Date.now()
  });

  // ═══ Increment task count & check cooldown ═══
  let cooldownTriggered = false;
  let recentCount = 0;
  await DB.ref("users/" + MY_ID).transaction(cur => {
    if (!cur) return cur;
    cur.recent_task_count = Number(cur.recent_task_count || 0) + 1;
    recentCount = cur.recent_task_count;
    if (cur.recent_task_count >= TASKS_BEFORE_COOLDOWN) {
      cur.cooldown_until = Date.now() + (COOLDOWN_MINUTES * 60 * 1000);
      cur.recent_task_count = 0;
      cooldownTriggered = true;
    }
    return cur;
  });

  // ═══ Show success screen ═══
  const body = document.getElementById('taskModalBody');
  body.innerHTML = `
    <button class="close-btn" id="doneClose">✕</button>
    <h3 style="text-align:center">🎉 সম্পূর্ণ!</h3>
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:80px;margin-bottom:12px">💰</div>
      <div style="font-size:32px;font-weight:900;color:#16a34a">+${money(task.reward_usd)}</div>
      <p style="color:#667085;font-size:13px;margin-top:10px">Reward claimed!</p>
      <div style="margin-top:14px;padding:10px;background:#f1f5f9;border-radius:10px;font-size:12px;color:#475569">
        Task ${recentCount}/${TASKS_BEFORE_COOLDOWN} (before cooldown)
      </div>
      ${cooldownTriggered ? `<div style="margin-top:12px;padding:12px;background:#fee2e2;border-radius:10px;font-size:12.5px;color:#7f1d1d">
        ⛔ ${TASKS_BEFORE_COOLDOWN}টি task করেছেন। ${COOLDOWN_MINUTES} মিনিটের cooldown শুরু।
      </div>` : ''}
    </div>`;

  document.getElementById('doneClose').onclick = () => {
    document.getElementById('taskModal').classList.remove('show');
    CURRENT_TASK = null;
    render();
  };

  // ═══ After success — Rewarded Popup (প্রতি ৩ task-এ) ═══
  setTimeout(async () => {
    document.getElementById('taskModal').classList.remove('show');
    CURRENT_TASK = null;
    if (cooldownTriggered) {
      showCooldown(COOLDOWN_MINUTES * 60 * 1000);
    } else {
      // ═══ প্রতি ৩ task-এ Popup ═══
      const totalTasksToday = COMPLETIONS.filter(c => c.day_key === day).length;
      if (totalTasksToday % 3 === 0) {
        setTimeout(() => showRewardedPopup(), 500);
      }
    }
    render();
    toast("✅ +" + money(task.reward_usd) + " earned!", "success");
  }, cooldownTriggered ? 2500 : 2000);
}

/* ═══ NAV ═══ */
function nav(id, el){
  CURRENT_CATEGORY = null;
  CURRENT_SECTION = id;
  document.querySelectorAll('.section').forEach(x => x.classList.remove('show'));
  const sec = document.getElementById(id);
  if (sec) sec.classList.add('show');
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function previewWdCut(){
  const amt = parseFloat(document.getElementById('wdAmt').value);
  const preview = document.getElementById('wdPreview');
  const refCount = Number(ME.referral_count || 0);
  const range = getWithdrawRange(refCount);
  if (!range || isNaN(amt) || amt <= 0) { preview.style.display = 'none'; return; }
  const cutAmount = amt * range.cut / 100;
  const finalAmount = amt - cutAmount;
  const rate = parseFloat(SETTINGS.USD_TO_BDT || 123);
  preview.style.display = 'block';
  preview.innerHTML = `
    <div style="display:flex;justify-content:space-between"><span>Requested:</span><b>$${amt.toFixed(2)}</b></div>
    <div style="display:flex;justify-content:space-between;color:#b45309"><span>Cut (${range.cut}%):</span><b>-$${cutAmount.toFixed(2)}</b></div>
    <div style="display:flex;justify-content:space-between;color:#15803d"><span>You receive:</span><b>$${finalAmount.toFixed(2)} (৳${(finalAmount*rate).toFixed(2)})</b></div>`;
}

async function requestWd(){
  const msg = document.getElementById('wdMsg');
  const method = document.getElementById('wdMethod').value;
  const acc = document.getElementById('wdAcc').value.trim();
  const amt = parseFloat(document.getElementById('wdAmt').value);
  const rate = parseFloat(SETTINGS.USD_TO_BDT || 123);
  const refCount = Number(ME.referral_count || 0);
  const range = getWithdrawRange(refCount);

  if (!range) { msg.textContent = "❌ Level unlock নেই"; msg.style.color = "#b91c1c"; return; }
  if (!acc || acc.length < 6) { msg.textContent = "❌ Valid account"; msg.style.color = "#b91c1c"; return; }
  if (isNaN(amt) || amt < range.min) { msg.textContent = "❌ Min $" + range.min.toFixed(2); msg.style.color = "#b91c1c"; return; }
  if (amt > range.max) { msg.textContent = "❌ Max $" + range.max.toFixed(2); msg.style.color = "#b91c1c"; return; }
  if (amt > Number(ME.balance_usd||0)) { msg.textContent = "❌ Balance নেই"; msg.style.color = "#b91c1c"; return; }

  const cutAmount = amt * range.cut / 100;
  const finalUsd = amt - cutAmount;
  const finalBdt = finalUsd * rate;

  const userRef = DB.ref("users/" + MY_ID);
  let ok = false;
  await userRef.transaction(cur => {
    if (!cur) return cur;
    if (Number(cur.balance_usd) < amt) return;
    cur.balance_usd = Number(cur.balance_usd) - amt;
    ok = true;
    return cur;
  });
  if (!ok) { msg.textContent = "❌ Failed"; return; }

  const wdRef = DB.ref("withdrawals").push();
  await wdRef.set({
    uid: MY_ID, user_name: ME.first_name || "", username: ME.username || null,
    amount_usd: amt, cut_pct: range.cut, cut_amount: cutAmount,
    final_usd: finalUsd, amount_bdt: Math.round(finalBdt * 100) / 100,
    method, account_number: acc, status: "pending", admin_note: "",
    level_at_request: range.level,
    created_at: Date.now(), processed_at: null
  });
  msg.textContent = "✅ Submitted!";
  msg.style.color = "#15803d";
  toast("✅ Withdrawal requested", "success");
}

function copyMyCode(){
  const code = ME.referral_code;
  if (!code) { toast("Code নেই", "error"); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(code).then(()=>toast("📋 Copied: " + code, "success"));
}

function copyRef(){
  const el = document.getElementById('refLink');
  if (!el) return;
  const text = el.textContent.trim();
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast("📋 Link Copied!", "success"));
}

(async () => { await startApp(); })();
</script>
