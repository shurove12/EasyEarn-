    else break;
  }
  return lv;
}
function getNextLevel(n){
  for (const L of LEVELS) {
    if (n < L.required) return L;
  }
  return null;
}
function getLevelData(lv){ return LEVELS.find(L=>L.lv===lv)||null; }
function canWithdraw(n){ return n >= LEVELS[0].required; }
function getWithdrawCut(n){ const lv=getCurrentLevel(n); return lv>=1 ? getLevelData(lv).cut : 3; }

async function renderAd(slotName, containerId){

  if (!cfg) { c.innerHTML=''; return; }
  const adminCfg = ADMIN_ADS[cfg.key] || {};
  if (adminCfg.enabled === false) { c.classList.add('hidden'); return; }
  c.classList.remove('hidden');
  if (cfg.type === 'direct') {
    c.innerHTML = `<div class="ad-label">Sponsored</div><a href="${cfg.script}" target="_blank" rel="noopener" style="display:block;padding:12px;background:#eff6ff;border-radius:10px;color:#2563eb;text-decoration:none;font-size:12px;font-weight:600">🔗 ${esc(cfg.name)}</a>`;
    return;
  }
  if (cfg.type === 'native') {
    c.innerHTML = `<div class="ad-label">Sponsored</div>${cfg.script}`;
    return;
  }
  c.innerHTML = `<div class="ad-label">Sponsored</div>`;
  const w = document.createElement('div');
  w.innerHTML = cfg.script.replace(/<\\\//g, '</');
  c.appendChild(w);

  });
}

/* ═══════════════════════════════════════════════════════════
   PARSE REFERRAL FROM URL / START_PARAM
   ═══════════════════════════════════════════════════════════ */
function parseReferral(){
  const hasTelegram = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user);
  const startParam = (hasTelegram && tg.initDataUnsafe.start_param) || "";

  if (startParam && startParam.startsWith("ref_")) {
    const parts = startParam.substring(4).split("_");
    PENDING_REFERRAL = parts[0] || null;
    if (parts.length > 1) PENDING_SUBPARAM = parts.slice(1).join("_");
    return;
  }

  // URL fallbacks
  const params = new URLSearchParams(window.location.search);
  const ref = params.get("ref");
  if (ref) {
    const parts = ref.split("_");
    PENDING_REFERRAL = parts[0] || null;
    if (parts.length > 1) PENDING_SUBPARAM = parts.slice(1).join("_");
    return;
  }
  const start = params.get("start") || "";
  if (start.startsWith("ref_")) {
    const parts = start.substring(4).split("_");
    PENDING_REFERRAL = parts[0] || null;
    if (parts.length > 1) PENDING_SUBPARAM = parts.slice(1).join("_");
  }
}

/* ═══════════════════════════════════════════════════════════
   AUTO-REGISTER FROM REFERRAL LINK
   ═══════════════════════════════════════════════════════════ */
async function tryAutoRegister(){
  if (!PENDING_REFERRAL) return false;

  const hasTelegram = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user);
  if (!hasTelegram) return false;

  const tgUser = tg.initDataUnsafe.user;
  MY_ID = "tg_" + tgUser.id;

  // Already exists? → login
  const snap = await DB.ref("users/" + MY_ID).get();
  if (snap.exists()) {
    if (snap.val().is_blocked) { renderBlocked(); return true; }
    boot();
    return true;
  }

  // Look up the referrer
  const refSnap = await DB.ref("referral_codes/" + PENDING_REFERRAL).get();
  if (!refSnap.exists()) return false;

  const referrerId = refSnap.val();
  if (!referrerId || referrerId === MY_ID) return false;

  // Auto-register
  const myCode = genUserCode();

  await DB.ref("users/" + MY_ID).set({
    id: MY_ID,
    telegram_id: tgUser.id,
    username: tgUser.username || null,
    first_name: tgUser.first_name || "User",
    last_name: tgUser.last_name || "",
    language: tgUser.language_code || "bn",
    balance_usd: 0,
    total_earned_usd: 0,
    total_withdrawn_usd: 0,
    referral_code: myCode,
    referred_by: referrerId,
    referred_by_code: PENDING_REFERRAL,
    sub_param: PENDING_SUBPARAM,
    referral_count: 0,
    level: 0,
    streak: 0,
    last_active_date: null,
    is_blocked: false,
    created_at: Date.now(),
    source: "telegram_referral"
  });

  // Register my code
  await DB.ref("referral_codes/" + myCode).set(MY_ID);

  // Update referrer: count + level bonus + $0.10 base
  await DB.ref("users/" + referrerId).transaction(cur => {
    if (!cur) return cur;
    cur.referral_count = Number(cur.referral_count || 0) + 1;
    const newRef = cur.referral_count;
    const prevLevel = getCurrentLevel(newRef - 1);
    const newLevel = getCurrentLevel(newRef);
    if (newLevel > prevLevel) {
      const L = getLevelData(newLevel);
      cur.level = newLevel;
      cur.balance_usd = Number(cur.balance_usd || 0) + L.bonus;
      cur.total_earned_usd = Number(cur.total_earned_usd || 0) + L.bonus;
      DB.ref("ledger").push({
        uid: referrerId, kind: "level_bonus", amount_usd: L.bonus,
        ref_id: "level:" + newLevel, meta: L.name, created_at: Date.now()
      });
    }
    return cur;
  });

  const baseBonus = 0.10;
  await DB.ref("users/" + referrerId).transaction(cur => {
    if (!cur) return cur;
    cur.balance_usd = Number(cur.balance_usd || 0) + baseBonus;
    cur.total_earned_usd = Number(cur.total_earned_usd || 0) + baseBonus;
    return cur;
  });
  DB.ref("ledger").push({
    uid: referrerId, kind: "referral_bonus", amount_usd: baseBonus,
    ref_id: "ref:" + MY_ID, meta: "New referral", created_at: Date.now()
  });

  toast("✅ Welcome to EasyEarn!", "success");
  boot();
  return true;
}

async function startApp(){
  parseReferral();

  const hasTelegram = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user);

  if (!hasTelegram) {
    return renderNoTelegram();
  }

  const tgUser = tg.initDataUnsafe.user;
  if (!tgUser || !tgUser.id) {
    return renderNoTelegram();
  }

  MY_ID = "tg_" + tgUser.id;

  // Existing user?
  const snap = await DB.ref("users/" + MY_ID).get();
  if (snap.exists()) {
    if (snap.val().is_blocked) return renderBlocked();
    return boot();
  }

  // New user + referral in URL → auto-register
  if (PENDING_REFERRAL) {
    const done = await tryAutoRegister();
    if (done) return;
    // referral invalid → fall to register with error
    return renderRegister("❌ Referral link সঠিক নয় বা মেয়াদ শেষ। অনুগ্রহ করে সঠিক link দিয়ে আসুন।");
  }

  // New user without referral → show register prompt
  return renderRegister();
}

    render();
  });

  DB.ref("tasks").on("value", snap => {
    const v = snap.val() || {};
    TASKS = Object.entries(v).map(([k,val]) => ({...val,_id:k})).filter(t => t.is_active !== false);
    render();
  });

  DB.ref("settings").on("value", snap => {

    render();
  });
}

function renderTasksSplit(midPoint, myToday){
  const top = document.getElementById('taskListTop');
  const bottom = document.getElementById('taskListBottom');
  if (!top || !bottom) return;
  if (!TASKS.length) { top.innerHTML = "<div class='empty'>কোনো task নেই</div>"; bottom.innerHTML = ""; return; }
  const renderOne = t => {
    const doneCount = myToday.filter(c => c.task_id === t._id).length;
    const limitReached = doneCount >= (t.daily_limit || 1);
    const icon = t.task_type === "ad" ? "📺" : t.task_type === "channel" ? "📢" : t.task_type === "social" ? "👍" : "🎁";
    return `
      <div class="task">
        <span class="icon">${icon}</span>
        <div class="info">
          <b>${esc(t.title)}</b>
          <div class="small" style="color:#667085">Reward $${Number(t.reward_usd).toFixed(2)} • Daily ${t.daily_limit||1}</div>
          <div class="badge">${esc(t.verify_type||"manual")}</div>
        </div>
        <button class="primary" ${limitReached ? "disabled" : ""} onclick="startTask('${t._id}')">
          ${limitReached ? "✅ Done" : "Start"}
        </button>
      </div>`;
  };
  top.innerHTML = TASKS.slice(0, midPoint).map(renderOne).join("");
  bottom.innerHTML = TASKS.slice(midPoint).map(renderOne).join("");
}

function nav(id, el){
  CURRENT_SECTION = id;
  document.querySelectorAll('.section').forEach(x => x.classList.remove('show'));
  document.getElementById(id).classList.add('show');
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(loadAdsForSection, 200);
}

async function startTask(taskId){
  const day = todayKey();
  const task = TASKS.find(t => t._id === taskId);
  if (!task) { toast("Task পাওয়া যায়নি", "error"); return; }
  const uSnap = await DB.ref("users/" + MY_ID).get();
  const u = uSnap.val();
  if (!u || u.is_blocked) { toast("Account blocked", "error"); return; }
  const todaySnap = await DB.ref("completions").orderByChild("uid").equalTo(MY_ID).get();
  const todayAll = todaySnap.val() || {};
  const doneCount = Object.values(todayAll).filter(c => c.task_id === taskId && c.day_key === day).length;
  if (doneCount >= (task.daily_limit || 1)) { toast("Daily limit reached", "error"); return; }
  const adSnap = await DB.ref("ad_revenue/" + day).get();
  const ad = adSnap.val() || { revenue_usd: 0, reward_paid_usd: 0 };
  const cap = parseFloat(SETTINGS.MAX_REWARD_RATIO || 0.60);
  if (ad.revenue_usd > 0 && (ad.reward_paid_usd + task.reward_usd) > ad.revenue_usd * cap) {
    toast("আজকের reward budget শেষ", "error"); return;
  }
  openTaskModal(task);
}

function openTaskModal(task){
  const modal = document.getElementById('taskModal');
  const body = document.getElementById('taskModalBody');
  const counter = parseInt(SETTINGS.TASK_COUNTER_SECONDS || 30);

  const directCfg = AD_CONFIG.task_direct;
  const adminDirect = ADMIN_ADS[directCfg.key] || {};
  if (adminDirect.enabled !== false && directCfg.script) {
    try { window.open(directCfg.script, "_blank", "noopener"); } catch(e){}
  }
  if (task.target_url) {
    if (tg && tg.openLink) tg.openLink(task.target_url);
    else window.open(task.target_url, "_blank", "noopener");
  }

  body.innerHTML = `
    <button class="close-btn" id="modalClose" disabled>✕</button>
    <h3>🎬 ${esc(task.title)}</h3>
    <p class="small" style="color:#667085;margin:0 0 10px">
      Reward: <b style="color:#16a34a">$${Number(task.reward_usd).toFixed(2)}</b> — ${counter}s অপেক্ষা করুন
    </p>
    <div class="counter-wrap">
      <div class="counter-circle" id="counterCircle" style="--pct:0%">
        <div style="position:relative;text-align:center">
          <div class="counter-num" id="counterNum">${counter}</div>
          <div class="counter-label">Seconds</div>
        </div>
      </div>
      <div class="counter-hint" id="counterHint">⏳ এড লোড হচ্ছে…</div>
    </div>
    <div class="modal-ad-zone" id="ad_task_modal_top"></div>
    <div class="modal-ad-zone" id="ad_task_modal_mid"></div>
    <button class="verify-btn" id="verifyBtn" disabled>
      ⏳ অপেক্ষা করুন (<span id="verifyCount">${counter}</span>s)
    </button>`;

  modal.classList.add('show');

  setTimeout(() => {
    renderAd('task_modal_top', 'ad_task_modal_top');
    renderAd('task_modal_mid', 'ad_task_modal_mid');
  }, 50);

  let remaining = counter;
  const verifyBtn = document.getElementById('verifyBtn');
  const verifyCount = document.getElementById('verifyCount');
  const counterNum = document.getElementById('counterNum');
  const counterCircle = document.getElementById('counterCircle');
  const counterHint = document.getElementById('counterHint');
  const closeBtn = document.getElementById('modalClose');

  setTimeout(() => {
    counterHint.textContent = '✅ এড লোড হয়েছে!';
    counterHint.style.color = '#16a34a';
  }, 1500);

  const interval = setInterval(() => {
    remaining--;
    const pct = ((counter - remaining) / counter) * 100;
    counterNum.textContent = Math.max(0, remaining);
    verifyCount.textContent = Math.max(0, remaining);
    counterCircle.style.setProperty('--pct', pct + '%');
    if (remaining <= 0) {
      clearInterval(interval);
      verifyBtn.disabled = false;
      verifyBtn.classList.add('ready');
      verifyBtn.innerHTML = '✅ Claim $' + Number(task.reward_usd).toFixed(2);
      closeBtn.disabled = false;
      counterHint.textContent = '🎉 টাইমার শেষ! Reward claim করুন';
      verifyBtn.onclick = () => finalizeTask(task);
    }
  }, 1000);

  closeBtn.onclick = () => { if (!closeBtn.disabled) modal.classList.remove('show'); };
}

async function finalizeTask(task){
  const day = todayKey();
  await DB.ref("users/" + MY_ID).transaction(cur => {
    if (!cur) return cur;
    cur.balance_usd = Number(cur.balance_usd || 0) + Number(task.reward_usd);
    cur.total_earned_usd = Number(cur.total_earned_usd || 0) + Number(task.reward_usd);
    if (cur.last_active_date !== day) {
      const y = new Date(); y.setDate(y.getDate()-1);
      const yKey = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
      if (cur.last_active_date === yKey) cur.streak = Number(cur.streak||0)+1;
      else cur.streak = 1;
      cur.last_active_date = day;
    }
    return cur;
  });
  await DB.ref("completions").push({
    uid: MY_ID, task_id: task._id, reward_usd: task.reward_usd,
    status: "verified", day_key: day, created_at: Date.now()
  });
  await DB.ref("ad_revenue/" + day).transaction(cur => {
    if (!cur) cur = { revenue_usd: 0, reward_paid_usd: 0 };
    cur.reward_paid_usd = Number(cur.reward_paid_usd || 0) + Number(task.reward_usd);
    return cur;
  });
  DB.ref("ledger").push({
    uid: MY_ID, kind: "task_reward", amount_usd: task.reward_usd,
    ref_id: "task:" + task._id, created_at: Date.now()
  });
  document.getElementById('taskModal').classList.remove('show');
  toast("✅ +$" + Number(task.reward_usd).toFixed(2) + " earned!", "success");
}

function previewWdCut(){
  const amt = parseFloat(document.getElementById('wdAmt').value);
  const preview = document.getElementById('wdPreview');
  if (isNaN(amt) || amt <= 0) { preview.style.display = 'none'; return; }
  const refCount = Number(ME.referral_count || 0);
  const cutPct = getWithdrawCut(refCount);
  const cutAmount = amt * cutPct / 100;
  const finalAmount = amt - cutAmount;
  const rate = parseFloat(SETTINGS.USD_TO_BDT || 123);
  preview.style.display = 'block';
  preview.innerHTML = `
    <div style="display:flex;justify-content:space-between"><span>Requested:</span><b>$${amt.toFixed(2)}</b></div>
    <div style="display:flex;justify-content:space-between;color:#b45309"><span>Commission (${cutPct}%):</span><b>-$${cutAmount.toFixed(2)}</b></div>
    <div style="display:flex;justify-content:space-between;color:#15803d"><span>You receive:</span><b>$${finalAmount.toFixed(2)} (৳${(finalAmount*rate).toFixed(2)})</b></div>`;
}

async function requestWd(){
  const msg = document.getElementById('wdMsg');
  const method = document.getElementById('wdMethod').value;
  const acc = document.getElementById('wdAcc').value.trim();
  const amt = parseFloat(document.getElementById('wdAmt').value);

  const reqRef = LEVELS[0].required;
  const rate = parseFloat(SETTINGS.USD_TO_BDT || 123);
  const refCount = Number(ME.referral_count || 0);

  if (!canWithdraw(refCount)) { msg.textContent = "❌ " + reqRef + " referrals প্রয়োজন"; msg.style.color = "#b91c1c"; return; }
  if (!acc || acc.length < 6) { msg.textContent = "❌ Valid account number দিন"; msg.style.color = "#b91c1c"; return; }
  if (isNaN(amt) || amt < 1) { msg.textContent = "❌ সর্বনিম্ন $1.00"; msg.style.color = "#b91c1c"; return; }
  if (amt > Number(ME.balance_usd||0)) { msg.textContent = "❌ পর্যাপ্ত balance নেই"; msg.style.color = "#b91c1c"; return; }

  const cutPct = getWithdrawCut(refCount);
  const cutAmount = amt * cutPct / 100;
  const finalUsd = amt - cutAmount;
  const finalBdt = finalUsd * rate;

  const userRef = DB.ref("users/" + MY_ID);
  let ok = false;
  await userRef.transaction(cur => {
    if (!cur) return cur;
    if (Number(cur.balance_usd) < amt) return;
    cur.balance_usd = Number(cur.balance_usd) - amt;
    ok = true;
    return cur;
  });
  if (!ok) { msg.textContent = "❌ Balance update failed"; return; }

  const wdRef = DB.ref("withdrawals").push();
  await wdRef.set({
    uid: MY_ID, user_name: ME.first_name || "", username: ME.username || null,
    amount_usd: amt, cut_pct: cutPct, cut_amount: cutAmount,
    final_usd: finalUsd, amount_bdt: Math.round(finalBdt * 100) / 100,
    method, account_number: acc, status: "pending", admin_note: "",
    level_at_request: getCurrentLevel(refCount),
    created_at: Date.now(), processed_at: null
  });

  DB.ref("ledger").push({
    uid: MY_ID, kind: "withdraw_hold", amount_usd: -amt,
    ref_id: "wd:" + wdRef.key, meta: "Cut " + cutPct + "%", created_at: Date.now()
  });

  msg.textContent = "✅ Request submitted! ($" + finalUsd.toFixed(2) + " → ৳" + finalBdt.toFixed(2) + ")";
  msg.style.color = "#15803d";
  document.getElementById('wdAcc').value = "";
  document.getElementById('wdAmt').value = "";
  document.getElementById('wdPreview').style.display = 'none';
  toast("✅ Withdrawal requested", "success");
}

function copyRef(){
  const text = document.getElementById('refLink').textContent.trim();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(()=>toast("📋 Copied!", "success"));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast("📋 Copied!", "success");
  }
}

(async () => {
  await startApp();
})();
